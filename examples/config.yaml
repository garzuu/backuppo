# Schema target per la configurazione di backuppo.
# I segreti non vanno mai scritti qui in chiaro: si referenziano tramite
# variabili d'ambiente con i campi *_env.

destinations:
  local-nas:
    type: fs
    root: /mnt/backups

  hetzner-sftp:
    type: sftp
    host: u123456.your-storagebox.de
    port: 23
    user: u123456
    # Autenticazione: almeno uno tra password_env e key_path (Hetzner
    # Storage Box supporta entrambe). Con key_path, key_passphrase_env è
    # opzionale (solo se la chiave privata è cifrata).
    password_env: HETZNER_SFTP_PASSWORD
    # key_path: /etc/backuppo/keys/hetzner_id_ed25519
    root: /backups
    # Fingerprint SHA256 della host key (formato OpenSSH): consigliata in
    # produzione, altrimenti la host key viene accettata senza verifica.
    host_key_fingerprint: "SHA256:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    retry:
      max_times: 5
    bandwidth_limit_kib_s: 5120 # 5 MiB/s

  backblaze-b2:
    type: s3
    bucket: my-backups
    region: us-west-002
    endpoint: https://s3.us-west-002.backblazeb2.com
    access_key_id_env: B2_KEY_ID
    secret_access_key_env: B2_APPLICATION_KEY
    root: /site1

  # Cloud drive OAuth (analoghi: dropbox e one_drive).
  # drive:
  #   type: google_drive
  #   root: /backuppo
  #   access_token_env: DRIVE_ACCESS_TOKEN
  #   refresh_token_env: DRIVE_REFRESH_TOKEN
  #   client_id: application-client-id
  #   client_secret_env: DRIVE_CLIENT_SECRET

  # Motore predefinito per i nuovi job: snapshot incrementali e deduplicati.
  incremental:
    type: restic
    repository: /var/backups/backuppo-restic
    password_env: RESTIC_PASSWORD
    append_only: false
    # Per un repository S3 immutabile usare append_only: true e identita
    # separate. Verificare poi la policy con `bkpo storage-check`.
    # environment:
    #   AWS_ACCESS_KEY_ID: S3_BACKUP_ACCESS_KEY
    #   AWS_SECRET_ACCESS_KEY: S3_BACKUP_SECRET_KEY
    # maintenance_environment:
    #   AWS_ACCESS_KEY_ID: S3_ADMIN_ACCESS_KEY
    #   AWS_SECRET_ACCESS_KEY: S3_ADMIN_SECRET_KEY
    # object_lock:
    #   bucket: my-backups
    #   region: eu-central-1
    #   access_key_id_env: S3_LOCK_CHECK_ACCESS_KEY
    #   secret_access_key_env: S3_LOCK_CHECK_SECRET_KEY
    #   expected_mode: compliance
    #   minimum_retention_days: 30

notifiers:
  ops-telegram:
    type: telegram
    token_env: TELEGRAM_BOT_TOKEN
    chat_id: "123456789"

  ops-email:
    type: smtp
    host: smtp.example.com
    port: 587
    user: backups@example.com
    password_env: SMTP_PASSWORD
    from: backups@example.com
    to:
      - ops@example.com

  ops-webhook:
    type: webhook
    url: https://hooks.example.com/backuppo

  # Push sul telefono (app ntfy o app Backuppo). Il topic funge da
  # "password" se l'istanza è pubblica: scegline uno lungo e casuale.
  # ops-ntfy:
  #   type: ntfy
  #   url: https://ntfy.sh
  #   topic: backuppo-cambiami-con-un-valore-casuale
  #   token_env: NTFY_TOKEN   # opzionale, per topic protetti

  # Entità Home Assistant via MQTT Discovery: per ogni job pubblica un
  # binary_sensor (ultima esecuzione) e un sensor (timestamp dell'ultimo
  # successo), entrambi raggruppati sotto un device "Backuppo". Richiede
  # un broker MQTT (es. Mosquitto) e l'integrazione MQTT già attiva in
  # Home Assistant.
  # ops-home-assistant:
  #   type: mqtt
  #   host: 192.168.1.10
  #   port: 1883
  #   user: backuppo
  #   password_env: MQTT_PASSWORD
  #   client_id: backuppo
  #   discovery_prefix: homeassistant
  #   tls: false

  # Richiede il binario compilato con la feature Cargo `hub` (Fase 11,
  # opt-in). Manda solo metadati (esiti, durate, errori) all'hub, mai
  # contenuto dei backup né segreti.
  # sede-centrale:
  #   type: hub
  #   url: https://hub.example.com
  #   token_env: HUB_TOKEN
  #   heartbeat_seconds: 60
  #   queue_path: /var/lib/backuppo/hub-queue.sqlite
  #   # Opt-in: ritira dall'hub "esegui ora"/"verifica ora" (solo job di questa config).
  #   remote_commands: false
  #   command_poll_seconds: 15
  #   # Recuperabile da GET /v1/policy/public-key sull'hub.
  #   policy_public_key: BASE64_ED25519_PUBLIC_KEY
  #   policy_site_id: 1
  #   policy_state_path: /var/lib/backuppo/policy-state.json
  #   policy_poll_seconds: 300

observability:
  history_path: /var/lib/backuppo/history.sqlite
  status_page: /var/lib/backuppo/status.html

api:
  bind: 127.0.0.1:8787

# Aggiornamenti firmati. Inserire la chiave pubblica pubblicata dal progetto.
# updates:
#   manifest_url: https://github.com/garzuu/backuppo/releases/latest/download/update-stable.json
#   public_key: BASE64_ED25519_PUBLIC_KEY
#   recovery_public_keys: []
#   channel: stable
#   download_dir: /var/lib/backuppo/updates
#   install_mode: standalone # notify | standalone | package | docker
#   auto_download: false

reports:
  # Report settimanale ogni lunedì alle 08:00 sugli ultimi sette giorni.
  - schedule: "0 8 * * 1"
    days: 7
    notifiers:
      - ops-email

jobs:
  home-documents:
    source:
      type: folder
      path: /home/user/Documents
      exclude:
        - "*.tmp"
        - "node_modules/"
    destination: incremental
    engine: restic
    schedule: "0 3 * * *" # ogni giorno alle 03:00
    verify_restore: daily
    max_backup_age_hours: 26 # allarme se l'ultimo backup ha più di 26h
    retention:
      daily: 7
      weekly: 4
      monthly: 6
    notify:
      on_success:
        - ops-telegram
      on_failure:
        - ops-telegram
        - ops-email
      on_verify:
        - ops-telegram

  # Esempio PostgreSQL. Se `container` è presente, pg_dump viene eseguito
  # dentro quel container; se è assente, viene usato il pg_dump locale.
  app-postgres:
    source:
      type: postgres
      host: localhost
      port: 5432
      user: postgres
      password_env: POSTGRES_PASSWORD
      database: app
      container: app-postgres
    destination: incremental
    engine: restic
    schedule: "30 3 * * *"
    verify_restore: weekly
    pre:
      - "echo 'inizio backup database'"
    post:
      - "echo 'backup database completato'"

  # Altre sorgenti supportate:
  # source: { type: mysql, host: localhost, port: 3306, user: root,
  #           password_env: MYSQL_PASSWORD, database: app, container: app-mysql }
  # source: { type: sqlite, path: /var/lib/app/app.sqlite }
  # source: { type: docker_volume, volume: app_data }
  # source: { type: command, command: /usr/local/bin/export-data,
  #           args: ["--format", "json"], output_filename: export.json }
  # source: { type: disk_image, path: /dev/disk/by-id/example,
  #           output_filename: disk.img }
  # source: { type: libvirt_vm, name: app-vm }
  # Richiede l'agent sul nodo Proxmox stesso (accesso diretto a vzdump).
  # source: { type: proxmox_vm, vmid: 100, mode: snapshot }
  # Richiede il binario govc installato e autenticato tramite le sue
  # variabili d'ambiente (GOVC_URL/GOVC_USERNAME/GOVC_PASSWORD), non tramite
  # questo file. La VM deve essere spenta.
  # source: { type: vmware_vm, vm: app01 }
