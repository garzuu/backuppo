[package]
name = "backuppo-destinations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
backon = "1.6.0"
backuppo-core.workspace = true
opendal = { version = "0.59.2", default-features = false, features = ["auto-register-services", "http-transport-reqwest", "http-transport-reqwest-rustls", "layers-retry", "layers-throttle", "services-fs", "services-s3", "services-webdav"] }
russh = "=0.51.1"
russh-sftp = "3.0.0"
tokio = { version = "1", features = ["fs", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
