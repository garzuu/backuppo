[package]
name = "backuppo-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hub multi-sito: riceve stato dagli agent, controlla gli heartbeat, espone l'API di gestione"

[[bin]]
name = "backuppo-hub"
path = "src/main.rs"

[dependencies]
backuppo-core.workspace = true
backuppo-notifiers.workspace = true
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["json"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jsonwebtoken = "9.3.1"
rand = "0.8.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
