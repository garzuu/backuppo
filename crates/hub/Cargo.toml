[package]
name = "backuppo-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hub multi-sito: riceve stato dagli agent, controlla gli heartbeat, espone l'API di gestione"

[[bin]]
name = "backuppo-hub"
path = "src/main.rs"

[dependencies]
backuppo-core.workspace = true
backuppo-notifiers.workspace = true
anyhow = "1.0.104"
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["json"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jsonwebtoken = "9.3.1"
rand = "0.8.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.0"

[package.metadata.deb]
name = "backuppo-hub"
maintainer = "garzuu <matteo@garzulano.com>"
copyright = "2026, garzuu"
extended-description = """\
Hub multi-sito per Backuppo: riceve stato ed eventi dagli agent, gestisce \
heartbeat, utenti, token e policy di sicurezza firmate."""
section = "utils"
priority = "optional"
depends = "$auto"
systemd-units = { unit-name = "backuppo-hub", enable = false, start = false }
assets = [
  ["target/release/backuppo-hub", "usr/bin/backuppo-hub", "755"],
  ["README.md", "usr/share/doc/backuppo-hub/README.md", "644"],
  ["CHANGELOG.md", "usr/share/doc/backuppo-hub/CHANGELOG.md", "644"],
  ["LICENSE-MIT", "usr/share/doc/backuppo-hub/LICENSE-MIT", "644"],
  ["LICENSE-APACHE", "usr/share/doc/backuppo-hub/LICENSE-APACHE", "644"],
  ["examples/hub-config.yaml", "usr/share/doc/backuppo-hub/examples/hub-config.yaml", "644"],
  ["deploy/packaging/common/backuppo-hub.service", "lib/systemd/system/backuppo-hub.service", "644"],
]

[package.metadata.generate-rpm]
name = "backuppo-hub"
assets = [
  { source = "target/release/backuppo-hub", dest = "/usr/bin/backuppo-hub", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/backuppo-hub/README.md", mode = "644", doc = true },
  { source = "LICENSE-MIT", dest = "/usr/share/doc/backuppo-hub/LICENSE-MIT", mode = "644", doc = true },
  { source = "deploy/packaging/common/backuppo-hub.service", dest = "/usr/lib/systemd/system/backuppo-hub.service", mode = "644" },
]
