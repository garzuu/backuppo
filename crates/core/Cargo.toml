[package]
name = "backuppo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Client dell'hub: senza questa feature il tipo di notifier `hub` non esiste
# nemmeno a livello di config, coerentemente con l'agent stand-alone.
hub = []

[dependencies]
async-trait = "0.1.92"
cron = "0.17.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
