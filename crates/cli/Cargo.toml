[package]
name = "backuppo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bkpo"
path = "src/main.rs"

[dependencies]
backuppo-core.workspace = true
backuppo-engine.workspace = true
backuppo-sources.workspace = true
backuppo-destinations.workspace = true
backuppo-notifiers.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-cron-scheduler = "0.15.1"

[dev-dependencies]
tempfile = "3.27.0"
