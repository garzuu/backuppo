[package]
name = "backuppo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backup agent cross-platform con verifica automatica del restore"

[[bin]]
name = "bkpo"
path = "src/main.rs"

[features]
default = ["hub"]
hub = ["backuppo-core/hub", "backuppo-notifiers/hub"]

[dependencies]
backuppo-core.workspace = true
backuppo-engine.workspace = true
backuppo-sources.workspace = true
backuppo-destinations.workspace = true
backuppo-notifiers.workspace = true
age = "0.12.1"
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
anyhow = "1.0.104"
axum = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
schemars = "1.0.4"
tempfile = "3.27.0"
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }
semver = "1.0.27"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["fs", "net", "rt-multi-thread", "macros", "signal", "sync"] }
tokio-cron-scheduler = "0.15.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
name = "backuppo"
maintainer = "garzuu <matteo@garzulano.com>"
copyright = "2026, garzuu"
extended-description = """\
Agent di backup open source e cross-platform con verifica automatica del \
restore, cifratura age e destinazioni locali/SFTP/S3/WebDAV/cloud drive."""
section = "utils"
priority = "optional"
depends = "$auto"
systemd-units = { unit-name = "backuppo", enable = false, start = false }
assets = [
  ["target/release/bkpo", "usr/bin/bkpo", "755"],
  ["README.md", "usr/share/doc/backuppo/README.md", "644"],
  ["CHANGELOG.md", "usr/share/doc/backuppo/CHANGELOG.md", "644"],
  ["LICENSE-MIT", "usr/share/doc/backuppo/LICENSE-MIT", "644"],
  ["LICENSE-APACHE", "usr/share/doc/backuppo/LICENSE-APACHE", "644"],
  ["examples/config.yaml", "usr/share/doc/backuppo/examples/config.yaml", "644"],
  ["deploy/packaging/common/backuppo.service", "lib/systemd/system/backuppo.service", "644"],
]

[package.metadata.generate-rpm]
name = "backuppo"
assets = [
  { source = "target/release/bkpo", dest = "/usr/bin/bkpo", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/backuppo/README.md", mode = "644", doc = true },
  { source = "LICENSE-MIT", dest = "/usr/share/doc/backuppo/LICENSE-MIT", mode = "644", doc = true },
  { source = "deploy/packaging/common/backuppo.service", dest = "/usr/lib/systemd/system/backuppo.service", mode = "644" },
]
