[package]
name = "backupper"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "backupper"
path = "src/main.rs"

[dependencies]
backupper-core.workspace = true
backupper-engine.workspace = true
backupper-sources.workspace = true
backupper-destinations.workspace = true
backupper-notifiers.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
