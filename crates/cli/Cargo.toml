[package]
name = "backuppo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backup agent cross-platform con verifica automatica del restore"

[[bin]]
name = "bkpo"
path = "src/main.rs"

[dependencies]
backuppo-core.workspace = true
backuppo-engine.workspace = true
backuppo-sources.workspace = true
backuppo-destinations.workspace = true
backuppo-notifiers.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
anyhow = "1.0.104"
axum = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "macros", "signal", "sync"] }
tokio-cron-scheduler = "0.15.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.27.0"
