services:
  hub:
    image: ghcr.io/garzuu/backuppo-hub:${BACKUPPO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HUB_JWT_SECRET: ${HUB_JWT_SECRET:?set HUB_JWT_SECRET in .env}
      HUB_POLICY_SIGNING_KEY: ${HUB_POLICY_SIGNING_KEY:?set HUB_POLICY_SIGNING_KEY in .env}
    volumes:
      - hub-config:/etc/backuppo-hub
      - hub-data:/var/lib/backuppo-hub

volumes:
  hub-config:
  hub-data:
