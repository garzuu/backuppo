name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Web UI
        run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - name: Validate Unix installers
        run: |
          sh -n deploy/linux/install-agent.sh deploy/linux/install-hub.sh
          sh -n deploy/macos/install-agent.sh deploy/macos/install-hub.sh

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy (feature hub)
        run: cargo clippy -p backuppo -p backuppo-notifiers -p backuppo-core --all-targets --features hub -- -D warnings

      - name: cargo test (feature hub)
        run: cargo test -p backuppo -p backuppo-notifiers -p backuppo-core --features hub

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag backuppo-agent:ci -f Dockerfile.agent .
      - name: Smoke test container
        run: docker run --rm backuppo-agent:ci --version

  docker-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hub container image
        run: docker build --tag backuppo-hub:ci -f Dockerfile.hub .
      - name: Smoke test hub container
        run: docker run --rm backuppo-hub:ci --version

  platform-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build Web UI
        run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Build Agent and Hub
        run: |
          cargo build --locked --release --package backuppo --target ${{ matrix.target }}
          cargo build --locked --release --package backuppo-hub --target ${{ matrix.target }}
      - name: Validate Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path deploy/windows/install-agent.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path deploy/windows/install-hub.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Verify static Linux binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: file target/${{ matrix.target }}/release/bkpo | grep -E 'statically linked|static-pie linked'
